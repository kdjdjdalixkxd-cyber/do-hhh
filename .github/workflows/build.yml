name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -o -q project.zip
      - name: Fix pip line
        run: |
          sed -i 's/install("--no-deps", "UnityPy")/options("--no-deps")\n            install("UnityPy")/' UnityMeshExtractor/app/build.gradle.kts
          sed -n 36,50p UnityMeshExtractor/app/build.gradle.kts
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Android SDK packages
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build
        shell: bash
        working-directory: UnityMeshExtractor
        run: gradle assembleDebug --console=plain --no-daemon 2>&1 | tee ../build.log
      - name: Show errors
        if: failure()
        run: grep -n -B2 -A20 "What went wrong" build.log || tail -60 build.log
      - uses: actions/upload-artifact@v4
        with:
          name: UnityMeshExtractor-debug
          path: UnityMeshExtractor/app/build/outputs/apk/debug/*.apk
