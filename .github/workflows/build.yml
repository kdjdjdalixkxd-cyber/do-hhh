name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -o -q project.zip
      - name: Fix project files
        run: |
          F=UnityMeshExtractor/app/build.gradle.kts
          sed -i 's/install("--no-deps", "UnityPy")/options("--no-deps")\n            install("UnityPy")/' $F
          sed -i 's/options("--no-deps")/options("--no-deps", "--only-binary=:all:")/' $F
          sed -i 's/"fmod_toolkit", "pyfmodex", "archspec"/"fmod_toolkit", "pyfmodex", "archspec", "brotli"/' UnityMeshExtractor/app/src/main/python/extractor.py
      - name: Add libc++_shared.so
        run: |
          NDK="${ANDROID_NDK_ROOT:-$ANDROID_HOME/ndk}"
          for pair in "arm64-v8a:aarch64-linux-android" "x86_64:x86_64-linux-android"; do
            abi=${pair%%:*}; tr=${pair##*:}
            src=$(find "$NDK" -path "*sysroot/usr/lib/$tr/libc++_shared.so" | head -1)
            echo "$abi -> $src"
            test -n "$src"
            mkdir -p UnityMeshExtractor/app/src/main/jniLibs/$abi
            cp "$src" UnityMeshExtractor/app/src/main/jniLibs/$abi/
          done
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Android SDK packages
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build
        shell: bash
        working-directory: UnityMeshExtractor
        run: gradle assembleDebug --console=plain --no-daemon 2>&1 | tee ../build.log
      - name: Show errors
        if: failure()
        run: grep -n -B2 -A20 "What went wrong" build.log || tail -60 build.log
      - uses: actions/upload-artifact@v4
        with:
          name: UnityMeshExtractor-debug
          path: UnityMeshExtractor/app/build/outputs/apk/debug/*.apk
